name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Extract Version
        id: get_version
        run: |
          # Extract version from build-deb.sh using grep
          # Looks for VERSION="x.y.z"
          VERSION=$(grep -oP 'VERSION="\K[^"]+' build-deb.sh)
          
          if [[ -z "$VERSION" ]]; then
            echo "::error::Version could not be extracted from build-deb.sh"
            exit 1
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Extracted version: $VERSION"

      - name: Check if Release Exists
        id: check_release
        run: |
          TAG_NAME="v${{ env.VERSION }}"
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG_NAME does not exist."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build Application
        if: steps.check_release.outputs.exists == 'false'
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh

      - name: Create Release
        uses: softprops/action-gh-release@v1
        if: steps.check_release.outputs.exists == 'false'
        with:
          tag_name: v${{ env.VERSION }}
          name: Release v${{ env.VERSION }}
          files: |
            dist/*.deb
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notification on Skip
        if: steps.check_release.outputs.exists == 'true'
        run: |
          echo "Release v${{ env.VERSION }} already exists. Skipping build and release."
          
      - name: Notify on Failure
        if: failure()
        run: |
          echo "::error::Build or Release workflow failed!"
